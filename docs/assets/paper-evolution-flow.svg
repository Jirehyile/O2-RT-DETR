<svg xmlns="http://www.w3.org/2000/svg" width="920" height="150" viewBox="0 0 920 150" role="img" aria-label="Technical evolution from RT-DETR to this project">
  <defs>
    <linearGradient id="paperBg" x1="0" x2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#ecfdf5"/></linearGradient>
    <filter id="paperShadow" x="-20%" y="-30%" width="140%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity=".14"/></filter>
  </defs>
  <rect x="1" y="1" width="918" height="148" rx="20" fill="url(#paperBg)" stroke="#cbd5e1"/>
  <text x="460" y="27" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#334155">TECHNICAL EVOLUTION</text>
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle" filter="url(#paperShadow)">
    <g transform="translate(150 79)"><rect x="-83" y="-27" width="166" height="54" rx="14" fill="#2563eb"/><text y="5" font-size="15" font-weight="700" fill="#fff">RT-DETR</text></g>
    <g transform="translate(460 79)"><rect x="-92" y="-27" width="184" height="54" rx="14" fill="#0f766e"><animate attributeName="opacity" values="1;.76;1" dur="2.5s" repeatCount="indefinite"/></rect><text y="-2" font-size="15" font-weight="700" fill="#fff">O²-RTDETR</text><text y="16" font-size="10" fill="#ccfbf1">oriented detection</text></g>
    <g transform="translate(770 79)"><rect x="-104" y="-27" width="208" height="54" rx="14" fill="#7c3aed"/><text y="-2" font-size="15" font-weight="700" fill="#fff">OUR RESEARCH</text><text y="16" font-size="10" fill="#ede9fe">dense · long-tail · query</text></g>
  </g>
  <path d="M236 79 H361 M553 79 H659" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7">
    <animate attributeName="stroke-dashoffset" values="28;0" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <path d="M350 72 L362 79 L350 86 M648 72 L660 79 L648 86" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="460" y="132" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">real-time DETR foundation → oriented representation → fixed-budget query research</text>
</svg>
