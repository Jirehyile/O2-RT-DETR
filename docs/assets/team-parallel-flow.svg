<svg xmlns="http://www.w3.org/2000/svg" width="920" height="190" viewBox="0 0 920 190" role="img" aria-label="Parallel two-member research plan">
  <defs>
    <linearGradient id="teamBg" x1="0" x2="1"><stop stop-color="#eff6ff"/><stop offset=".5" stop-color="#faf5ff"/><stop offset="1" stop-color="#ecfeff"/></linearGradient>
    <filter id="teamShadow" x="-20%" y="-30%" width="140%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#334155" flood-opacity=".15"/></filter>
  </defs>
  <rect x="1" y="1" width="918" height="188" rx="20" fill="url(#teamBg)" stroke="#cbd5e1"/>
  <text x="460" y="27" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#334155">TWO TRACKS · ONE EXPERIMENT PROTOCOL</text>
  <g font-family="Segoe UI,Arial,sans-serif" filter="url(#teamShadow)">
    <g transform="translate(70 48)"><rect width="160" height="46" rx="13" fill="#2563eb"/><text x="80" y="20" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">MEMBER A</text><text x="80" y="36" text-anchor="middle" font-size="10" fill="#dbeafe">A + main innovation B</text></g>
    <g transform="translate(70 116)"><rect width="160" height="46" rx="13" fill="#7c3aed"/><text x="80" y="20" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">MEMBER B</text><text x="80" y="36" text-anchor="middle" font-size="10" fill="#ede9fe">C + unified validation</text></g>
    <g transform="translate(365 70)"><rect width="190" height="72" rx="16" fill="#475569"/><text x="95" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">INDEPENDENT TESTS</text><text x="95" y="48" text-anchor="middle" font-size="10" fill="#e2e8f0">Baseline · A · B · C</text><text x="95" y="63" text-anchor="middle" font-size="10" fill="#e2e8f0">36 epochs · same protocol</text></g>
    <g transform="translate(700 70)"><rect width="160" height="72" rx="16" fill="#0f766e"><animate attributeName="opacity" values="1;.74;1" dur="2.4s" repeatCount="indefinite"/></rect><text x="80" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">JOINT METHOD</text><text x="80" y="48" text-anchor="middle" font-size="10" fill="#ccfbf1">A+B · A+C · B+C</text><text x="80" y="63" text-anchor="middle" font-size="10" fill="#ccfbf1">A+B+C</text></g>
  </g>
  <path d="M231 71 C285 71 300 90 358 99 M231 139 C285 139 300 120 358 113 M556 106 H692" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7">
    <animate attributeName="stroke-dashoffset" values="28;0" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <path d="M348 92 L359 99 L347 105 M348 106 L359 113 L348 120 M681 99 L693 106 L681 113" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="460" y="178" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">separate ownership · shared baseline · cross-review before combination</text>
</svg>
