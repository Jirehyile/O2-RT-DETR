<svg xmlns="http://www.w3.org/2000/svg" width="920" height="150" viewBox="0 0 920 150" role="img" aria-label="O2-RTDETR research flow">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="0.5" stop-color="#f5f3ff"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#334155" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect x="1" y="1" width="918" height="148" rx="20" fill="url(#bg)" stroke="#cbd5e1"/>
  <text x="460" y="27" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#334155">O²-RTDETR RESEARCH PIPELINE</text>
  <path d="M132 86 H788" fill="none" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>
  <circle r="7" fill="#fff" stroke="#7c3aed" stroke-width="4">
    <animateMotion dur="4.5s" repeatCount="indefinite" path="M132 86 H788"/>
  </circle>
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle" filter="url(#shadow)">
    <g transform="translate(130 86)">
      <circle r="31" fill="#2563eb"><animate attributeName="r" values="29;33;29" dur="2.4s" repeatCount="indefinite"/></circle>
      <text y="5" font-size="13" font-weight="700" fill="#fff">BASELINE</text>
    </g>
    <g transform="translate(350 86)">
      <circle r="31" fill="#475569"/>
      <text y="-2" font-size="13" font-weight="700" fill="#fff">DIAGNOSE</text>
      <text y="15" font-size="10" fill="#e2e8f0">Query · Angle</text>
    </g>
    <g transform="translate(570 86)">
      <circle r="31" fill="#7c3aed"><animate attributeName="opacity" values="1;.72;1" dur="2.2s" repeatCount="indefinite"/></circle>
      <text y="-2" font-size="13" font-weight="700" fill="#fff">INNOVATE</text>
      <text y="15" font-size="10" fill="#ede9fe">A · B · C</text>
    </g>
    <g transform="translate(790 86)">
      <circle r="31" fill="#0f766e"/>
      <text y="-2" font-size="13" font-weight="700" fill="#fff">VALIDATE</text>
      <text y="15" font-size="10" fill="#ccfbf1">DV · L315</text>
    </g>
  </g>
  <text x="460" y="137" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">fixed 300 queries · R18-vd · accuracy and efficiency reported together</text>
</svg>
